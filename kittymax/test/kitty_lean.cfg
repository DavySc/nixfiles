\* test/run.sh: seconds.  At MaxMoves = 3, MaxEdits = 2 the invariants hold over
\* 14 million states (about 2 minutes); the temporal check there takes much longer.
SPECIFICATION Spec
CONSTANTS
  Positions = {"p1", "p2"}
  MaxMoves = 2
  MaxEdits = 1
  Fix = TRUE
INVARIANTS TypeOK Honest
PROPERTIES NeverStale Settles
CHECK_DEADLOCK FALSE
