\* test/run.sh: seconds.  It also runs Design = "pr" (the first version,
\* which strands a file when the one starting the server is not selected),
\* "nonote" (two servers) and eglot's own timeout (Limit = 1 < Need), and
\* TLC must reject each.
SPECIFICATION Spec
CONSTANTS
  Files = {"A", "B", "C"}
  MaxFails = 1
  MaxKills = 2
  Design = "fixed"
  Need = 2
  Limit = 0
INVARIANTS TypeOK OneServer NoStaleNote
PROPERTIES NoFileLeftBehind
CHECK_DEADLOCK FALSE
